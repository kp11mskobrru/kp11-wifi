<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>КП-11 — Админка</title>
  <link rel="icon" href="college-predprinimatelstva-11.png" type="image/png"/>
  <meta name="robots" content="noindex, nofollow">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f1419;
      color: #e6e6e6;
      min-height: 100vh;
      padding: 20px;
    }

    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: fixed;
      inset: 0;
      background: #0f1419;
      z-index: 100;
    }
    .login-box {
      background: #1a1f26;
      padding: 40px 36px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #2a3038;
      text-align: center;
    }
    .login-box h1 { font-size: 20px; color: #1893d2; margin-bottom: 6px; }
    .login-box .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
    .login-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a3038;
      background: #0f1419;
      color: #fff;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
      font-family: inherit;
    }
    .login-box input:focus { border-color: #1893d2; }
    .login-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1893d2;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .login-box button:hover { background: #1479ae; }
    #loginError {
      color: #ff5252;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    #adminScreen { display: none; }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .top-bar h1 { font-size: 20px; color: #1893d2; }
    .top-bar .stats { color: #888; font-size: 13px; }

    .btn {
      background: #1a1f26;
      color: #ccc;
      border: 1px solid #2a3038;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: 0.15s;
    }
    .btn:hover { background: #232a33; color: #fff; }
    .btn-danger { color: #ff7676; border-color: #3a2020; }
    .btn-danger:hover { background: #2a1818; }
    .btn-danger-solid {
      background: #d32f2f;
      color: #fff;
      border: 1px solid #d32f2f;
    }
    .btn-danger-solid:hover { background: #b71c1c; }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      border-bottom: 1px solid #2a3038;
      overflow-x: auto;
    }
    .tab {
      padding: 10px 18px;
      cursor: pointer;
      color: #888;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: 0.15s;
    }
    .tab:hover { color: #ccc; }
    .tab.active {
      color: #1893d2;
      border-bottom-color: #1893d2;
    }

    /* ====== Фильтр по направлениям ====== */
    .direction-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: #1a1f26;
      border: 1px solid #2a3038;
      border-radius: 10px;
    }
    .dir-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: #232a33;
      color: #bbb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #2a3038;
      transition: 0.15s;
      font-family: inherit;
      letter-spacing: 0.3px;
    }
    .dir-btn:hover {
      background: #2e3640;
      color: #fff;
    }
    .dir-btn.active {
      background: #1893d2;
      color: #fff;
      border-color: #1893d2;
    }
    .dir-btn .count {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      font-size: 11px;
      opacity: 0.85;
    }
    .dir-btn.active .count { background: rgba(0,0,0,0.3); }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #2a3038;
      background: #1a1f26;
      color: #fff;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      font-family: inherit;
    }
    .search-input:focus { border-color: #1893d2; }

    .bulk-bar {
      display: none;
      background: #2a1818;
      border: 1px solid #3a2020;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .bulk-bar.show { display: flex; }
    .bulk-bar .count { color: #ff9e9e; font-size: 13px; }
    .bulk-bar .actions { display: flex; gap: 8px; }

    .table-wrap {
      background: #1a1f26;
      border-radius: 12px;
      border: 1px solid #2a3038;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 12px 14px;
      background: #232a33;
      color: #aaa;
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-top: 1px solid #2a3038;
      vertical-align: top;
    }
    tr:hover td { background: #1f252d; }
    tr.selected td { background: #2a1818; }

    .checkbox-cell {
      width: 40px;
      text-align: center;
    }
    .checkbox-cell input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #d32f2f;
    }

    .name { font-weight: 600; color: #fff; }
    .phone { color: #4dd0e1; font-family: monospace; font-size: 13px; }
    .group-cell { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
    .group-badge {
      display: inline-block;
      padding: 3px 9px;
      background: #1893d2;
      color: #fff;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .course-label {
      font-size: 10px;
      color: #7a828c;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .role-badge {
      display: inline-block;
      padding: 3px 9px;
      background: #f0a500;
      color: #fff;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .small { color: #888; font-size: 12px; }
    .ip { color: #ffb74d; font-family: monospace; font-size: 12px; }
    .time { color: #666; font-size: 11px; white-space: nowrap; }

    .actions { display: flex; gap: 6px; }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #232a33;
      color: #ccc;
      text-decoration: none;
      font-size: 16px;
      border: 1px solid #2a3038;
      transition: 0.15s;
      cursor: pointer;
      font-family: inherit;
    }
    .action-btn:hover { background: #2e3640; color: #fff; }
    .action-btn.tg:hover { background: #229ED9; color: #fff; border-color: #229ED9; }
    .action-btn.vk:hover { background: #4680C2; color: #fff; border-color: #4680C2; }
    .action-btn.call:hover { background: #4CAF50; color: #fff; border-color: #4CAF50; }
    .action-btn.del:hover { background: #d32f2f; color: #fff; border-color: #d32f2f; }

    .empty {
      text-align: center;
      color: #555;
      padding: 60px 20px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .top-bar h1 { font-size: 17px; }
      th, td { padding: 9px 10px; font-size: 12px; }
      .action-btn { width: 30px; height: 30px; font-size: 14px; }
      .dir-btn { padding: 6px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Админка КП-11</h1>
    <div class="sub">Введите пароль для входа</div>
    <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off">
    <button id="loginBtn">Войти</button>
    <div id="loginError">Неверный пароль</div>
  </div>
</div>

<div id="adminScreen">

  <div class="top-bar">
    <h1>📊 КП-11 — Админка</h1>
    <div class="stats" id="stats">Загрузка...</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" id="exportBtn">📥 CSV</button>
      <button class="btn btn-danger" id="deleteAllBtn">🗑 Удалить всё</button>
      <button class="btn btn-danger" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="visits">👀 Шрек (visits)</div>
    <div class="tab" data-tab="students">🎓 Студенты (students)</div>
    <div class="tab" data-tab="staff">👨‍🏫 Педагоги (staff)</div>
  </div>

  <!-- Фильтр по направлениям (виден только на вкладке «Студенты») -->
  <div class="direction-filter" id="directionFilter" style="display:none;"></div>

  <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по ФИО, телефону, группе, городу...">

  <div class="bulk-bar" id="bulkBar">
    <div class="count" id="bulkCount">Выбрано: 0</div>
    <div class="actions">
      <button class="btn btn-danger-solid" id="deleteSelectedBtn">🗑 Удалить выбранные</button>
      <button class="btn" id="clearSelectionBtn">Снять выбор</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody">
        <tr><td colspan="10" class="empty">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot,
    doc, deleteDoc, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ====== ПАРОЛЬ ======
  const ADMIN_PASSWORD = "kp11admin2026";
  // ====================

  const firebaseConfig = {
    apiKey: "AIzaSyD2vzKJrL9_3YnDWO_GECuyHnRJTujQ3Zg",
    authDomain: "kp11-wifi.firebaseapp.com",
    projectId: "kp11-wifi",
    storageBucket: "kp11-wifi.firebasestorage.app",
    messagingSenderId: "262830985110",
    appId: "1:262830985110:web:6253b9cd57e767a04b57b7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ====== Известные направления (в порядке отображения) ======
  const KNOWN_DIRECTIONS = ["КТ", "МЗМ", "А", "ФТ", "Ю", "ТОА", "СКД"];

  // ====== Извлечение направления и курса из названия группы ======
  // Например: "КТ21-25" → {dir: "КТ", course: 2}
  //           "МЗМ11-26" → {dir: "МЗМ", course: 1}
  //           "А11-26" → {dir: "А", course: 1}
  //           "ФТ43оз-23" → {dir: "ФТ", course: 4}
  function parseGroup(group) {
    if (!group) return { dir: null, course: null };
    const s = String(group).trim();

    // Направление — буквы в начале
    const dirMatch = s.match(/^([А-Яа-яЁёA-Za-z]+)/);
    const dir = dirMatch ? dirMatch[1].toUpperCase() : null;

    // Курс — первая цифра после букв
    const numMatch = s.match(/[А-Яа-яЁёA-Za-z]+(\d)/);
    const course = numMatch ? parseInt(numMatch[1], 10) : null;

    return { dir, course };
  }

  function courseLabel(course) {
    if (course === 1) return "1 курс";
    if (course === 2) return "2 курс";
    if (course === 3) return "3 курс";
    if (course === 4) return "4 курс";
    return "";
  }

  // ====== Логин ======
  const loginScreen = document.getElementById('loginScreen');
  const adminScreen = document.getElementById('adminScreen');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');

  function tryLogin() {
    if (passwordInput.value === ADMIN_PASSWORD) {
      sessionStorage.setItem('kp11_admin_ok', '1');
      showAdmin();
    } else {
      loginError.style.display = 'block';
      passwordInput.value = '';
    }
  }
  loginBtn.addEventListener('click', tryLogin);
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('kp11_admin_ok');
    location.reload();
  });

  function showAdmin() {
    loginScreen.style.display = 'none';
    adminScreen.style.display = 'block';
    startListening();
  }
  if (sessionStorage.getItem('kp11_admin_ok') === '1') showAdmin();

  // ====== Состояние ======
  let currentTab = 'visits';
  let currentDirection = 'ALL'; // "ALL" или конкретное направление
  const allData = { visits: [], students: [], staff: [] };
  const selected = new Set();
  let listenersStarted = false;

  // ====== Табы ======
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      currentDirection = 'ALL';
      selected.clear();
      updateBulkBar();
      renderDirectionFilter();
      renderTable();
    });
  });

  // ====== Поиск ======
  document.getElementById('searchInput').addEventListener('input', renderTable);

  // ====== Подписки ======
  function startListening() {
    if (listenersStarted) return;
    listenersStarted = true;

    ['visits', 'students', 'staff'].forEach(name => {
      const q = query(collection(db, name), orderBy("time", "desc"));
      onSnapshot(q, (snap) => {
        allData[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderDirectionFilter();
        renderTable();
      }, (err) => {
        console.error(`Ошибка чтения ${name}:`, err);
      });
    });
  }

  // ====== Фильтр направлений ======
  function renderDirectionFilter() {
    const box = document.getElementById('directionFilter');

    // Показываем только на вкладке «Студенты»
    if (currentTab !== 'students') {
      box.style.display = 'none';
      return;
    }
    box.style.display = 'flex';

    const students = allData.students || [];

    // Считаем количество по направлениям
    const counts = { ALL: students.length };
    students.forEach(d => {
      const { dir } = parseGroup(d.group);
      if (!dir) return;
      counts[dir] = (counts[dir] || 0) + 1;
    });

    // Собираем уникальные направления: сначала известные, потом остальные
    const found = new Set();
    students.forEach(d => {
      const { dir } = parseGroup(d.group);
      if (dir) found.add(dir);
    });

    const ordered = [];
    KNOWN_DIRECTIONS.forEach(k => { if (found.has(k)) ordered.push(k); });
    Array.from(found).forEach(k => { if (!KNOWN_DIRECTIONS.includes(k)) ordered.push(k); });

    // Строим HTML
    let html = '';
    html += `<button class="dir-btn ${currentDirection === 'ALL' ? 'active' : ''}" data-dir="ALL">
              Все <span class="count">${counts.ALL}</span>
            </button>`;
    ordered.forEach(dir => {
      const c = counts[dir] || 0;
      if (c === 0 && currentDirection !== dir) return; // пустые направления не показываем
      html += `<button class="dir-btn ${currentDirection === dir ? 'active' : ''}" data-dir="${dir}">
                ${dir} <span class="count">${c}</span>
              </button>`;
    });

    box.innerHTML = html;

    // Обработчики
    box.querySelectorAll('.dir-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentDirection = btn.dataset.dir;
        selected.clear();
        updateBulkBar();
        renderDirectionFilter();
        renderTable();
      });
    });
  }

  // ====== Утилиты ======
  function fmtTime(t) {
    if (!t) return '—';
    try {
      const d = t.toDate ? t.toDate() : new Date(t);
      return d.toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    } catch { return '—'; }
  }
  function normalizePhone(p) {
    if (!p) return '';
    return String(p).replace(/[^\d+]/g, '');
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function getFilteredData() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    let data = allData[currentTab] || [];

    // Фильтр по направлению (только для вкладки «Студенты»)
    if (currentTab === 'students' && currentDirection !== 'ALL') {
      data = data.filter(d => {
        const { dir } = parseGroup(d.group);
        return dir === currentDirection;
      });
    }

    // Поиск
    if (search) {
      data = data.filter(d => JSON.stringify(d).toLowerCase().includes(search));
    }

    return data;
  }

  // ====== Bulk bar ======
  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    const count = document.getElementById('bulkCount');
    if (selected.size > 0) {
      bar.classList.add('show');
      count.textContent = `Выбрано: ${selected.size}`;
    } else {
      bar.classList.remove('show');
    }
  }

  // ====== Отрисовка ======
  function renderTable() {
    const data = getFilteredData();

    document.getElementById('stats').textContent =
      `Всего: ${(allData[currentTab] || []).length} | Показано: ${data.length} | Выбрано: ${selected.size}`;

    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');

    const allChecked = data.length > 0 && data.every(d => selected.has(d.id));

    if (currentTab === 'students') {
      head.innerHTML = `
        <tr>
          <th class="checkbox-cell"><input type="checkbox" id="selectAllCheck" ${allChecked ? 'checked' : ''}></th>
          <th>ФИО</th>
          <th>Телефон</th>
          <th>Группа</th>
          <th>Время</th>
          <th>Действия</th>
        </tr>`;
    } else if (currentTab === 'staff') {
      head.innerHTML = `
        <tr>
          <th class="checkbox-cell"><input type="checkbox" id="selectAllCheck" ${allChecked ? 'checked' : ''}></th>
          <th>ФИО</th>
          <th>Телефон</th>
          <th>Роль</th>
          <th>Время</th>
          <th>Действия</th>
        </tr>`;
    } else {
      head.innerHTML = `
        <tr>
          <th class="checkbox-cell"><input type="checkbox" id="selectAllCheck" ${allChecked ? 'checked' : ''}></th>
          <th>ФИО</th>
          <th>Телефон</th>
          <th>Группа</th>
          <th>Устройство</th>
          <th>IP / Город</th>
          <th>Заряд</th>
          <th>Время</th>
          <th>Действия</th>
        </tr>`;
    }

    // «Выбрать все»
    setTimeout(() => {
      const selectAll = document.getElementById('selectAllCheck');
      if (selectAll) {
        selectAll.addEventListener('change', (e) => {
          if (e.target.checked) data.forEach(d => selected.add(d.id));
          else data.forEach(d => selected.delete(d.id));
          updateBulkBar();
          renderTable();
        });
      }
    }, 0);

    if (data.length === 0) {
      body.innerHTML = `<tr><td colspan="10" class="empty">Ничего не найдено</td></tr>`;
      return;
    }

    body.innerHTML = data.map(d => {
      const phone = normalizePhone(d.phone);
      const phoneDisplay = escapeHtml(d.phone || '—');
      const tgLink = phone ? `tg://resolve?phone=${phone.replace('+', '')}` : '';
      const vkLink = phone ? `https://vk.com/search?c%5Bphone%5D=${phone.replace('+', '')}` : '';
      const callLink = phone ? `tel:${phone}` : '';
      const isChecked = selected.has(d.id);

      const actions = `
        <div class="actions">
          ${phone ? `
            <a class="action-btn tg" href="${tgLink}" title="Telegram" target="_blank" rel="noopener">📱</a>
            <a class="action-btn vk" href="${vkLink}" title="VK" target="_blank" rel="noopener">🅥</a>
            <a class="action-btn call" href="${callLink}" title="Позвонить">📞</a>
          ` : ''}
          <button class="action-btn del" data-id="${escapeHtml(d.id)}" title="Удалить">🗑</button>
        </div>`;

      const checkboxCell = `
        <td class="checkbox-cell">
          <input type="checkbox" class="row-check" data-id="${escapeHtml(d.id)}" ${isChecked ? 'checked' : ''}>
        </td>`;

      // Ячейка группы с подписью курса
      const groupCell = (() => {
        if (!d.group) return '<span class="small">—</span>';
        const { course } = parseGroup(d.group);
        const cl = courseLabel(course);
        return `
          <div class="group-cell">
            <span class="group-badge">${escapeHtml(d.group)}</span>
            ${cl ? `<span class="course-label">${cl}</span>` : ''}
          </div>`;
      })();

      if (currentTab === 'students') {
        return `
