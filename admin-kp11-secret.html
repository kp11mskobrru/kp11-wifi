<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>КП-11 — Админка</title>
  <link rel="icon" href="college-predprinimatelstva-11.png" type="image/png"/>
  <meta name="robots" content="noindex, nofollow">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f1419;
      color: #e6e6e6;
      min-height: 100vh;
      padding: 20px;
    }

    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; position: fixed; inset: 0;
      background: #0f1419; z-index: 100;
    }
    .login-box {
      background: #1a1f26; padding: 40px 36px;
      border-radius: 16px; width: 100%; max-width: 360px;
      border: 1px solid #2a3038; text-align: center;
    }
    .login-box h1 { font-size: 20px; color: #1893d2; margin-bottom: 6px; }
    .login-box .sub { font-size: 13px; color: #888; margin-bottom: 24px; }

    /* ===== Поле пароля с глазиком ===== */
    .password-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
    }
    .password-wrap input {
      width: 100%;
      padding: 12px 44px 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a3038;
      background: #0f1419;
      color: #fff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      margin-bottom: 0;
    }
    .password-wrap input:focus { border-color: #1893d2; }

    .toggle-pass {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1893d2;
      transition: 0.15s;
      font-family: inherit;
    }
    .toggle-pass:hover {
      background: rgba(24, 147, 210, 0.15);
      color: #4db8f0;
    }
    .toggle-pass svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .toggle-pass .icon-eye-off { display: none; }
    .toggle-pass.revealed .icon-eye { display: none; }
    .toggle-pass.revealed .icon-eye-off { display: block; }

    .login-box .login-btn {
      width: 100%; padding: 12px;
      border: none; border-radius: 10px;
      background: #1893d2; color: #fff;
      font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .login-box .login-btn:hover { background: #1479ae; }
    #loginError {
      color: #ff5252; font-size: 13px;
      margin-top: 10px; display: none;
    }

    #adminScreen { display: none; }

    .top-bar {
      display: flex; flex-wrap: wrap; gap: 12px;
      align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .top-bar h1 { font-size: 20px; color: #1893d2; }
    .top-bar .stats { color: #888; font-size: 13px; }
    .btn {
      background: #1a1f26; color: #ccc;
      border: 1px solid #2a3038;
      padding: 9px 14px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
      font-family: inherit; transition: 0.15s;
    }
    .btn:hover { background: #232a33; color: #fff; }
    .btn-danger { color: #ff7676; border-color: #3a2020; }
    .btn-danger:hover { background: #2a1818; }
    .btn-danger-solid {
      background: #d32f2f; color: #fff;
      border: 1px solid #d32f2f;
    }
    .btn-danger-solid:hover { background: #b71c1c; }

    .tabs {
      display: flex; gap: 6px;
      margin-bottom: 16px;
      border-bottom: 1px solid #2a3038;
      overflow-x: auto;
    }
    .tab {
      padding: 10px 18px; cursor: pointer;
      color: #888; font-size: 14px; font-weight: 500;
      border-bottom: 2px solid transparent;
      white-space: nowrap; transition: 0.15s;
    }
    .tab:hover { color: #ccc; }
    .tab.active {
      color: #1893d2;
      border-bottom-color: #1893d2;
    }

    .search-input {
      width: 100%; padding: 11px 14px;
      border-radius: 10px; border: 1px solid #2a3038;
      background: #1a1f26; color: #fff;
      font-size: 14px; margin-bottom: 14px;
      outline: none; font-family: inherit;
    }
    .search-input:focus { border-color: #1893d2; }

    .direction-filter {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: #1a1f26;
      border: 1px solid #2a3038;
      border-radius: 10px;
    }
    .dir-btn {
      padding: 8px 16px; border-radius: 8px;
      background: #232a33; color: #bbb;
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid #2a3038;
      transition: 0.15s; font-family: inherit;
      letter-spacing: 0.3px;
    }
    .dir-btn:hover { background: #2e3640; color: #fff; }
    .dir-btn.active {
      background: #1893d2; color: #fff;
      border-color: #1893d2;
    }
    .dir-btn .count {
      display: inline-block; margin-left: 6px;
      padding: 1px 7px; background: rgba(0,0,0,0.25);
      border-radius: 10px; font-size: 11px; opacity: 0.85;
    }
    .dir-btn.active .count { background: rgba(0,0,0,0.3); }

    .bulk-bar {
      display: none;
      background: #2a1818;
      border: 1px solid #3a2020;
      padding: 10px 16px; border-radius: 10px;
      margin-bottom: 14px;
      align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
    }
    .bulk-bar.show { display: flex; }
    .bulk-bar .count { color: #ff9e9e; font-size: 13px; }
    .bulk-bar .actions { display: flex; gap: 8px; }

    .table-wrap {
      background: #1a1f26;
      border-radius: 12px;
      border: 1px solid #2a3038;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 12px 14px;
      background: #232a33; color: #aaa;
      font-weight: 500; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-top: 1px solid #2a3038;
      vertical-align: middle;
    }
    tr:hover td { background: #1f252d; }
    tr.selected td { background: #2a1818; }

    .checkbox-cell {
      width: 40px; text-align: center;
    }
    .checkbox-cell input[type="checkbox"] {
      width: 18px; height: 18px;
      cursor: pointer; accent-color: #d32f2f;
    }

    .name { font-weight: 600; color: #fff; }
    .phone { color: #4dd0e1; font-family: monospace; font-size: 13px; }
    .group-badge {
      display: inline-block; padding: 3px 9px;
      background: #1893d2; color: #fff;
      border-radius: 6px; font-size: 11px; font-weight: 600;
    }
    .role-badge {
      display: inline-block; padding: 3px 9px;
      background: #f0a500; color: #fff;
      border-radius: 6px; font-size: 11px; font-weight: 600;
    }
    .small { color: #888; font-size: 12px; }
    .ip { color: #ffb74d; font-family: monospace; font-size: 12px; }
    .time { color: #666; font-size: 11px; white-space: nowrap; }

    .thumb-cell { width: 56px; text-align: center; }
    .thumb {
      width: 44px; height: 44px;
      border-radius: 8px; object-fit: cover;
      display: block; margin: 0 auto;
      cursor: pointer;
      border: 2px solid #2a3038;
      transition: 0.15s;
      background: #232a33;
    }
    .thumb:hover { border-color: #1893d2; transform: scale(1.05); }
    .thumb-placeholder {
      width: 44px; height: 44px;
      border-radius: 8px; background: #232a33;
      border: 2px solid #2a3038;
      display: flex; align-items: center; justify-content: center;
      color: #444; font-size: 20px; margin: 0 auto;
    }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px;
      border-radius: 8px;
      background: #232a33; color: #ccc;
      text-decoration: none; font-size: 16px;
      border: 1px solid #2a3038;
      transition: 0.15s; cursor: pointer;
      font-family: inherit;
    }
    .action-btn:hover { background: #2e3640; color: #fff; }
    .action-btn.tg:hover { background: #229ED9; color: #fff; border-color: #229ED9; }
    .action-btn.vk:hover { background: #4680C2; color: #fff; border-color: #4680C2; }
    .action-btn.call:hover { background: #4CAF50; color: #fff; border-color: #4CAF50; }
    .action-btn.photo:hover { background: #7b1fa2; color: #fff; border-color: #7b1fa2; }
    .action-btn.video:hover { background: #d32f2f; color: #fff; border-color: #d32f2f; }
    .action-btn.series:hover { background: #f57c00; color: #fff; border-color: #f57c00; }
    .action-btn.del:hover { background: #d32f2f; color: #fff; border-color: #d32f2f; }
    .action-btn.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

    .empty {
      text-align: center; color: #555;
      padding: 60px 20px; font-size: 14px;
    }

    .media-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 5000;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .media-modal.show { display: flex; }

    .media-modal-inner {
      background: #1a1f26; border-radius: 16px;
      max-width: 700px; width: 100%;
      max-height: 90vh; overflow: hidden;
      border: 1px solid #2a3038;
      display: flex; flex-direction: column;
    }
    .media-modal-header {
      display: flex; justify-content: space-between;
      align-items: center; padding: 14px 18px;
      border-bottom: 1px solid #2a3038;
      background: #232a33;
    }
    .media-modal-header .title {
      font-size: 14px; color: #fff; font-weight: 600;
    }
    .media-modal-close {
      background: transparent; border: none;
      color: #888; font-size: 22px;
      cursor: pointer; padding: 0 6px;
      font-family: inherit;
    }
    .media-modal-close:hover { color: #fff; }
    .media-modal-body {
      padding: 20px; overflow-y: auto; text-align: center;
    }
    .media-modal-body img,
    .media-modal-body video {
      max-width: 100%; max-height: 70vh;
      border-radius: 10px; display: block; margin: 0 auto;
    }
    .media-modal-body .meta {
      margin-top: 14px; color: #aaa;
      font-size: 13px; text-align: center;
    }
    .media-modal-body .meta b { color: #fff; }

    .series-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px; margin-bottom: 14px;
    }
    .series-grid img {
      width: 100%; border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .top-bar h1 { font-size: 17px; }
      th, td { padding: 9px 10px; font-size: 12px; }
      .action-btn { width: 30px; height: 30px; font-size: 14px; }
      .thumb, .thumb-placeholder { width: 38px; height: 38px; }
      .dir-btn { padding: 6px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Админка КП-11</h1>
    <div class="sub">Введите пароль для входа</div>

    <div class="password-wrap">
      <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off">
      <button type="button" class="toggle-pass" id="togglePass" title="Показать пароль">
        <svg class="icon-eye" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="icon-eye-off" viewBox="0 0 24 24">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>

    <button class="login-btn" id="loginBtn">Войти</button>
    <div id="loginError">Неверный пароль</div>
  </div>
</div>

<div id="adminScreen">
  <div class="top-bar">
    <h1>📊 КП-11 — Админка</h1>
    <div class="stats" id="stats">Загрузка...</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" id="exportBtn">📥 CSV</button>
      <button class="btn btn-danger" id="deleteAllBtn">🗑 Удалить всё</button>
      <button class="btn btn-danger" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="visits">👀 Шрек</div>
    <div class="tab" data-tab="students">🎓 Студенты</div>
    <div class="tab" data-tab="staff">👨‍🏫 Педагоги</div>
  </div>

  <div class="direction-filter" id="directionFilter" style="display:none;"></div>

  <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по ФИО, телефону, группе, городу...">

  <div class="bulk-bar" id="bulkBar">
    <div class="count" id="bulkCount">Выбрано: 0</div>
    <div class="actions">
      <button class="btn btn-danger-solid" id="deleteSelectedBtn">🗑 Удалить выбранные</button>
      <button class="btn" id="clearSelectionBtn">Снять выбор</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody">
        <tr><td colspan="10" class="empty">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="media-modal" id="mediaModal">
  <div class="media-modal-inner">
    <div class="media-modal-header">
      <div class="title" id="mediaTitle">Просмотр</div>
      <button class="media-modal-close" id="mediaClose">×</button>
    </div>
    <div class="media-modal-body" id="mediaBody"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot,
    doc, deleteDoc, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const ADMIN_PASSWORD = "kp11admin2026";

  const firebaseConfig = {
    apiKey: "AIzaSyD2vzKJrL9_3YnDWO_GECuyHnRJTujQ3Zg",
    authDomain: "kp11-wifi.firebaseapp.com",
    projectId: "kp11-wifi",
    storageBucket: "kp11-wifi.firebasestorage.app",
    messagingSenderId: "262830985110",
    appId: "1:262830985110:web:6253b9cd57e767a04b57b7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const KNOWN_DIRECTIONS = ["КТ", "МЗМ", "А", "ФТ", "Ю", "ТОА", "СКД"];

  function parseGroup(group) {
    if (!group) return { dir: null, course: null };
    const s = String(group).trim();
    const dirMatch = s.match(/^([А-Яа-яЁёA-Za-z]+)/);
    const dir = dirMatch ? dirMatch[1].toUpperCase() : null;
    const numMatch = s.match(/[А-Яа-яЁёA-Za-z]+(\d)/);
    const course = numMatch ? parseInt(numMatch[1], 10) : null;
    return { dir, course };
  }

  function courseLabel(course) {
    if (course === 1) return "1 курс";
    if (course === 2) return "2 курс";
    if (course === 3) return "3 курс";
    if (course === 4) return "4 курс";
    return "";
  }

  const loginScreen = document.getElementById('loginScreen');
  const adminScreen = document.getElementById('adminScreen');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');
  const togglePass = document.getElementById('togglePass');

  togglePass.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    togglePass.classList.toggle('revealed', isHidden);
    togglePass.title = isHidden ? 'Скрыть пароль' : 'Показать пароль';
    passwordInput.focus();
  });

  function tryLogin() {
    if (passwordInput.value === ADMIN_PASSWORD) {
      sessionStorage.setItem('kp11_admin_ok', '1');
      showAdmin();
    } else {
      loginError.style.display = 'block';
      passwordInput.value = '';
    }
  }
  loginBtn.addEventListener('click', tryLogin);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryLogin();
  });
  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('kp11_admin_ok');
    location.reload();
  });

  function showAdmin() {
    loginScreen.style.display = 'none';
    adminScreen.style.display = 'block';
    startListening();
  }
  if (sessionStorage.getItem('kp11_admin_ok') === '1') showAdmin();

  let currentTab = 'visits';
  let currentDirection = 'ALL';
  const allData = { visits: [], students: [], staff: [] };
  const selected = new Set();
  let listenersStarted = false;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      currentDirection = 'ALL';
      selected.clear();
      updateBulkBar();
      renderDirectionFilter();
      renderTable();
    });
  });

  document.getElementById('searchInput').addEventListener('input', renderTable);

  function startListening() {
    if (listenersStarted) return;
    listenersStarted = true;

    ['visits', 'students', 'staff'].forEach(name => {
      const q = query(collection(db, name), orderBy("time", "desc"));
      onSnapshot(q, (snap) => {
        allData[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderDirectionFilter();
        renderTable();
      }, (err) => {
        console.error(`Ошибка чтения ${name}:`, err);
      });
    });
  }

  function renderDirectionFilter() {
    const box = document.getElementById('directionFilter');

    if (currentTab !== 'students') {
      box.style.display = 'none';
      return;
    }
    box.style.display = 'flex';

    const students = allData.students || [];

    const counts = { ALL: students.length };
    students.forEach(d => {
      const { dir } = parseGroup(d.group);
      if (!dir) return;
      counts[dir] = (counts[dir] || 0) + 1;
    });

    const found = new Set();
    students.forEach(d => {
      const { dir } = parseGroup(d.group);
      if (dir) found.add(dir);
    });

    const ordered = [];
    KNOWN_DIRECTIONS.forEach(k => { if (found.has(k)) ordered.push(k); });
    Array.from(found).forEach(k => { if (!KNOWN_DIRECTIONS.includes(k)) ordered.push(k); });

    let html = '';
    html += `<button class="dir-btn ${currentDirection === 'ALL' ? 'active' : ''}" data-dir="ALL">
              Все <span class="count">${counts.ALL}</span>
            </button>`;
    ordered.forEach(dir => {
      const c = counts[dir] || 0;
      if (c === 0 && currentDirection !== dir) return;
      html += `<button class="dir-btn ${currentDirection === dir ? 'active' : ''}" data-dir="${dir}">
                ${dir} <span class="count">${c}</span>
              </button>`;
    });

    box.innerHTML = html;

    box.querySelectorAll('.dir-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentDirection = btn.dataset.dir;
        selected.clear();
        updateBulkBar();
        renderDirectionFilter();
        renderTable();
      });
    });
  }

  function fmtTime(t) {
    if (!t) return '—';
    try {
      const d = t.toDate ? t.toDate() : new Date(t);
      return d.toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    } catch { return '—'; }
  }
  function normalizePhone(p) {
    if (!p) return '';
    return String(p).replace(/[^\d+]/g, '');
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function getFilteredData() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    let data = allData[currentTab] || [];

    if (currentTab === 'students' && currentDirection !== 'ALL') {
      data = data.filter(d => {
        const { dir } = parseGroup(d.group);
        return dir === currentDirection;
      });
    }

    if (search) {
      data = data.filter(d => JSON.stringify(d).toLowerCase().includes(search));
    }
    return data;
  }

  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    const count = document.getElementById('bulkCount');
    if (selected.size > 0) {
      bar.classList.add('show');
      count.textContent = `Выбрано: ${selected.size}`;
    } else {
      bar.classList.remove('show');
    }
  }

  const mediaModal = document.getElementById('mediaModal');
  const mediaTitle = document.getElementById('mediaTitle');
  const mediaBody = document.getElementById('mediaBody');

  document.getElementById('mediaClose').addEventListener('click', () => {
    mediaModal.classList.remove('show');
    mediaBody.innerHTML = '';
  });
  mediaModal.addEventListener('click', (e) => {
    if (e.target === mediaModal) {
      mediaModal.classList.remove('show');
      mediaBody.innerHTML = '';
    }
  });

  function openMediaModal(title, htmlContent) {
    mediaTitle.textContent = title;
    mediaBody.innerHTML = htmlContent;
    mediaModal.classList.add('show');
  }

  function getItemCaption(item) {
    return `
      <div class="meta">
        <b>${escapeHtml(item.fio || '—')}</b>
        ${item.phone ? ' · ' + escapeHtml(item.phone) : ''}
        ${item.group ? ' · ' + escapeHtml(item.group) : ''}
        <br>
        ${fmtTime(item.time)}
      </div>`;
  }

  function openPhotoModal(item) {
    openMediaModal('📷 Фото', `<img src="${item.photo}" alt="Фото">${getItemCaption(item)}`);
  }

  function openVideoModal(item) {
    openMediaModal('🎥 Видео', `<video src="${item.video}" controls autoplay></video>${getItemCaption(item)}`);
  }

  function openSeriesModal(item) {
    const photos = item.photos || [];
    if (photos.length === 0) return;
    const grid = photos.map((p, i) =>
      `<img src="${p}" alt="Кадр ${i + 1}" data-index="${i}">`
    ).join('');
    const html = `
      <div class="series-grid">${grid}</div>
      ${getItemCaption(item)}
      <div style="margin-top:10px; color:#888; font-size:12px;">Нажми на кадр, чтобы увеличить</div>`;
    openMediaModal('🎞 Серия фото реакции', html);

    mediaBody.querySelectorAll('.series-grid img').forEach(img => {
      img.addEventListener('click', () => {
        const idx = parseInt(img.dataset.index, 10);
        openMediaModal(`📷 Кадр ${idx + 1} из ${photos.length}`,
          `<img src="${photos[idx]}" alt="Кадр">${getItemCaption(item)}`);
      });
    });
  }

  function renderTable() {
    const data = getFilteredData();

    document.getElementById('stats').textContent =
      `Всего: ${(allData[currentTab] || []).length} | Показано: ${data.length} | Выбрано: ${selected.size}`;

    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');

    const allChecked = data.length > 0 && data.every(d => selected.has(d.id));

    if (currentTab === 'students') {
      head.innerHTML = `
        <tr>
          <th class="checkbox-cell"><input type="checkbox" id="selectAllCheck" ${allChecked ? 'checked' : ''}></th>
          <th class="thumb-cell">Фото</th>
          <th>ФИО</th>
          <th>Телефон</th>
          <th>Группа</th>
          <th>Устройство</th>
          <th>IP / Город</th>
          <th>Заряд</th>
          <th>Время</th>
          <th>Действия</th>
        </tr>`;
    } else if (currentTab === 'staff') {
      head.innerHTML = `
        <tr>
          <th class="checkbox-cell"><input type="checkbox" id="selectAllCheck" ${allChecked ? 'checked' : ''}></th>
          <th class="thumb-cell">Фото</th>
          <th>ФИО</th>
          <th>Телефон</th>
          <th>Устройство</th>
          <th>IP / Город</th>
          <th>Заряд</th>
          <th>Время</th>
          <th>Действия</th>
        </tr>`;
    } else {
      head.innerHTML = `
        <tr>
          <th class="checkbox-cell"><input type="checkbox" id="selectAllCheck" ${allChecked ? 'checked' : ''}></th>
          <th class="thumb-cell">Фото</th>
          <th>ФИО</th>
          <th>Телефон</th>
          <th>Группа</th>
          <th>Устройство</th>
          <th>IP / Город</th>
          <th>Заряд</th>
          <th>Время</th>
          <th>Действия</th>
        </tr>`;
    }

    setTimeout(() => {
      const selectAll = document.getElementById('selectAllCheck');
      if (selectAll) {
        selectAll.addEventListener('change', (e) => {
          if (e.target.checked) data.forEach(d => selected.add(d.id));
          else data.forEach(d => selected.delete(d.id));
          updateBulkBar();
          renderTable();
        });
      }
    }, 0);

    if (data.length === 0) {
      body.innerHTML = `<tr><td colspan="11" class="empty">Ничего не найдено</td></tr>`;
      return;
    }

    body.innerHTML = data.map(d => {
      const phone = normalizePhone(d.phone);
      const phoneDisplay = escapeHtml(d.phone || '—');
      const tgLink = phone ? `tg://resolve?phone=${phone.replace('+', '')}` : '';
      const vkLink = phone ? `https://vk.com/search?c%5Bphone%5D=${phone.replace('+', '')}` : '';
      const callLink = phone ? `tel:${phone}` : '';
      const hasPhoto = !!d.photo;
      const hasVideo = !!d.video;
      const hasSeries = Array.isArray(d.photos) && d.photos.length > 0;
      const isChecked = selected.has(d.id);

      const device = [d.os, d.browser, d.model].filter(Boolean).join(' · ') || '—';
      const ipCity = [d.ip, d.ipCity, d.ipProvider].filter(Boolean).join(' · ') || '—';
      const battery = d.batteryLevel != null
        ? `${d.batteryLevel}% ${d.batteryCharging ? '⚡' : ''}`
        : '—';

      const checkboxCell = `
        <td class="checkbox-cell">
          <input type="checkbox" class="row-check" data-id="${escapeHtml(d.id)}" ${isChecked ? 'checked' : ''}>
        </td>`;

      const thumbCell = hasPhoto
        ? `<td class="thumb-cell">
             <img class="thumb" src="${d.photo}" data-id="${escapeHtml(d.id)}" data-tab="${currentTab}" alt="Фото">
           </td>`
        : `<td class="thumb-cell"><div class="thumb-placeholder">📷</div></td>`;

      const actions = `
        <div class="actions">
          ${phone ? `
            <a class="action-btn tg" href="${tgLink}" title="Telegram" target="_blank" rel="noopener">📱</a>
            <a class="action-btn vk" href="${vkLink}" title="VK" target="_blank" rel="noopener">🅥</a>
            <a class="action-btn call" href="${callLink}" title="Позвонить">📞</a>
          ` : ''}
          <button class="action-btn photo ${hasPhoto ? '' : 'disabled'}"
                  data-id="${escapeHtml(d.id)}" data-tab="${currentTab}" title="${hasPhoto ? 'Фото' : 'Нет фото'}">📷</button>
          <button class="action-btn video ${hasVideo ? '' : 'disabled'}"
                  data-id="${escapeHtml(d.id)}" data-tab="${currentTab}" title="${hasVideo ? 'Видео' : 'Нет видео'}">🎥</button>
          <button class="action-btn series ${hasSeries ? '' : 'disabled'}"
                  data-id="${escapeHtml(d.id)}" data-tab="${currentTab}" title="${hasSeries ? 'Серия' : 'Нет серии'}">🎞</button>
          <button class="action-btn del" data-id="${escapeHtml(d.id)}" data-tab="${currentTab}" title="Удалить">🗑</button>
        </div>`;

      const groupCell = (() => {
        if (!d.group) return '<span class="small">—</span>';
        const { course } = parseGroup(d.group);
        const cl = courseLabel(course);
        return `
          <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-start;">
            <span class="group-badge">${escapeHtml(d.group)}</span>
            ${cl ? `<span style="font-size:10px;color:#7a828c;text-transform:uppercase;letter-spacing:0.4px;">${cl}</span>` : ''}
          </div>`;
      })();

      if (currentTab === 'students') {
        return `
          <tr class="${isChecked ? 'selected' : ''}">
            ${checkboxCell}
            ${thumbCell}
            <td><div class="name">${escapeHtml(d.fio || '—')}</div></td>
            <td><span class="phone">${phoneDisplay}</span></td>
            <td>${groupCell}</td>
            <td><div class="small">${escapeHtml(device)}</div></td>
            <td><div class="ip">${escapeHtml(ipCity)}</div></td>
            <td><span class="small">${battery}</span></td>
            <td><span class="time">${fmtTime(d.time)}</span></td>
            <td>${actions}</td>
          </tr>`;
      }

      if (currentTab === 'staff') {
        return `
          <tr class="${isChecked ? 'selected' : ''}">
            ${checkboxCell}
            ${thumbCell}
            <td><div class="name">${escapeHtml(d.fio || '—')}</div>
                <div class="small">${escapeHtml(d.role || 'staff')}</div>
            </td>
            <td><span class="phone">${phoneDisplay}</span></td>
            <td><div class="small">${escapeHtml(device)}</div></td>
            <td><div class="ip">${escapeHtml(ipCity)}</div></td>
            <td><span class="small">${battery}</span></td>
            <td><span class="time">${fmtTime(d.time)}</span></td>
            <td>${actions}</td>
          </tr>`;
      }

      return `
        <tr class="${isChecked ? 'selected' : ''}">
          ${checkboxCell}
          ${thumbCell}
          <td><div class="name">${escapeHtml(d.fio || '—')}</div>
            <div class="small">${escapeHtml(d.role || '')}</div>
          </td>
          <td><span class="phone">${phoneDisplay}</span></td>
          <td>${groupCell}</td>
          <td><div class="small">${escapeHtml(device)}</div></td>
          <td><div class="ip">${escapeHtml(ipCity)}</div></td>
          <td><span class="small">${battery}</span></td>
          <td><span class="time">${fmtTime(d.time)}</span></td>
          <td>${actions}</td>
        </tr>`;
    }).join('');

    body.querySelectorAll('.row-check').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const id = e.target.dataset.id;
        if (e.target.checked) selected.add(id);
        else selected.delete(id);
        updateBulkBar();
        renderTable();
      });
    });

    body.querySelectorAll('.thumb').forEach(img => {
      img.addEventListener('click', () => {
        const item = (allData[img.dataset.tab] || []).find(x => x.id === img.dataset.id);
        if (item && item.photo) openPhotoModal(item);
      });
    });

    body.querySelectorAll('.action-btn.photo').forEach(btn => {
      if (btn.classList.contains('disabled')) return;
      btn.addEventListener('click', () => {
        const item = (allData[btn.dataset.tab] || []).find(x => x.id === btn.dataset.id);
        if (item && item.photo) openPhotoModal(item);
      });
    });

    body.querySelectorAll('.action-btn.video').forEach(btn => {
      if (btn.classList.contains('disabled')) return;
      btn.addEventListener('click', () => {
        const item = (allData[btn.dataset.tab] || []).find(x => x.id === btn.dataset.id);
        if (item && item.video) openVideoModal(item);
      });
    });

    body.querySelectorAll('.action-btn.series').forEach(btn => {
      if (btn.classList.contains('disabled')) return;
      btn.addEventListener('click', () => {
        const item = (allData[btn.dataset.tab] || []).find(x => x.id === btn.dataset.id);
        if (item && item.photos) openSeriesModal(item);
      });
    });

    body.querySelectorAll('.action-btn.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        if (!confirm('Удалить эту запись?')) return;
        try {
          await deleteDoc(doc(db, currentTab, id));
          selected.delete(id);
          updateBulkBar();
        } catch (err) {
          console.error("Ошибка удаления:", err);
          alert("Не удалось удалить: " + err.message);
        }
      });
    });
  }

  document.getElementById('deleteSelectedBtn').addEventListener('click', async () => {
    if (selected.size === 0) return;
    if (!confirm(`Удалить ${selected.size} записей? Действие необратимо.`)) return;

    const ids = Array.from(selected);
    try {
      for (let i = 0; i < ids.length; i += 500) {
        const chunk = ids.slice(i, i + 500);
        const batch = writeBatch(db);
        chunk.forEach(id => batch.delete(doc(db, currentTab, id)));
        await batch.commit();
      }
      selected.clear();
      updateBulkBar();
      renderTable();
    } catch (err) {
      console.error("Ошибка массового удаления:", err);
      alert("Не удалось удалить: " + err.message);
    }
  });

  document.getElementById('clearSelectionBtn').addEventListener('click', () => {
    selected.clear();
    updateBulkBar();
    renderTable();
  });

  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    const data = allData[currentTab] || [];
    if (data.length === 0) return alert('Здесь нечего удалять.');
    if (!confirm(`Удалить ВСЁ в "${currentTab}"? Это ${data.length} записей.`)) return;
    if (!confirm('Точно? Второе подтверждение.')) return;

    try {
      const ids = data.map(d => d.id);
      for (let i = 0; i < ids.length; i += 500) {
        const chunk = ids.slice(i, i + 500);
        const batch = writeBatch(db);
        chunk.forEach(id => batch.delete(doc(db, currentTab, id)));
        await batch.commit();
      }
      selected.clear();
      updateBulkBar();
    } catch (err) {
      console.error("Ошибка удаления всех:", err);
      alert("Не удалось удалить: " + err.message);
    }
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const data = getFilteredData();
    if (!data.length) return alert('Нет данных для экспорта');

    const EXCLUDE = ['photo', 'video', 'photos'];
    const allKeys = new Set();
    data.forEach(row => Object.keys(row).forEach(k => {
      if (!EXCLUDE.includes(k)) allKeys.add(k);
    }));
    const keys = Array.from(allKeys);

    const csvLines = [keys.join(';')];
    data.forEach(row => {
      const line = keys.map(k => {
        let v = row[k];
        if (v && typeof v === 'object' && v.toDate) {
          v = v.toDate().toLocaleString('ru-RU');
        } else if (v && typeof v === 'object') {
          v = JSON.stringify(v);
        }
        v = String(v ?? '').replace(/"/g, '""').replace(/;/g, ',');
        return `"${v}"`;
      }).join(';');
      csvLines.push(line);
    });

    const blob = new Blob(['\uFEFF' + csvLines.join('\n')], {
      type: 'text/csv;charset=utf-8'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `kp11-${currentTab}-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

</script>

</body>
</html>
